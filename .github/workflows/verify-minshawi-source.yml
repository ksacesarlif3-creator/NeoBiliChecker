name: Verify Al-Minshawi 2026 Audio Source

on:
  push:
    branches: [ "quran-minshawi-lost-v1" ]
    paths: [ ".github/workflows/verify-minshawi-source.yml" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Archive 2026 audio with QUL Minshawi resource
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, html

          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':'AlMinshawiMurattal-source-check/1.1'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), dict(r.headers)

          raw,_=get('https://archive.org/metadata/a00ssssss260908ddd')
          data=json.loads(raw)
          af={}
          for f in data.get('files',[]):
              n=str(f.get('name',''))
              m=re.match(r'^(\d{3})\s*-?.*\.mp3$', n, re.I)
              if m:
                  af[int(m.group(1))]=f
          print('Archive tracks', len(af))
          for s in [1,2,18,36,55,77,114]:
              f=af.get(s,{})
              print('ARCH',s,f.get('name'), 'length=',f.get('length'),'size=',f.get('size'))

          page,_=get('https://qul.tarteel.ai/resources/recitation/396')
          txt=page.decode('utf-8','replace')
          print('QUL page bytes',len(page))
          hrefs=re.findall(r'href=["\']([^"\']+)["\']',txt)
          for h in hrefs:
              if any(k in h.lower() for k in ['json','sqlite','download','recitation']):
                  print('HREF',html.unescape(h))
          scripts=re.findall(r'https?://[^"\'<> ]+',txt)
          for u in scripts:
              if any(k in u.lower() for k in ['json','sqlite','download','audio']):
                  print('URL',html.unescape(u)[:500])
          PY
