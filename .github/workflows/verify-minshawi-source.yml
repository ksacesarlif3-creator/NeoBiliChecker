name: Inspect exact Quran word payloads

on:
  push:
    branches: [ "quran-minshawi-lost-v1" ]
    paths: [ ".github/workflows/verify-minshawi-source.yml" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DigitalKhatt word text values
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/script.json \
            https://github.com/QUD-Technologies/quranic-universal-audio/releases/download/v4.0.0/digital_khatt_v2_script.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/script.json',encoding='utf-8'))
          for k in ['1:1:1','1:1:2','1:4:1','1:4:2','1:4:3','2:3:1','2:3:8','114:6:3']:
              print(k,repr(d.get(k)))
          print('entries',len(d))
          print('text_type',type(d['1:1:1']['text']).__name__)
          PY
