name: Verify Al-Minshawi 2026 Audio Source

on:
  push:
    branches: [ "quran-minshawi-lost-v1" ]
    paths: [ ".github/workflows/verify-minshawi-source.yml" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Minshawi 1967 word timings and Quran text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qua /tmp/quran
          curl -fL --retry 3 -o /tmp/qua/minshawi.zip \
            https://github.com/QUD-Technologies/quranic-universal-audio/releases/download/v4.0.0/mohammed_siddiq_al_minshawi_1967_drive.zip
          echo '=== ZIP LIST ==='
          unzip -l /tmp/qua/minshawi.zip | head -80
          unzip -q /tmp/qua/minshawi.zip -d /tmp/qua/unpacked
          echo '=== FILES ==='
          find /tmp/qua/unpacked -maxdepth 3 -type f -printf '%P\n' | head -100
          echo '=== SAMPLE CONTENT ==='
          python3 - <<'PY'
          import os,json,glob
          root='/tmp/qua/unpacked'
          for p in glob.glob(root+'/**/*',recursive=True):
              if not os.path.isfile(p): continue
              if p.lower().endswith(('.json','.txt','.csv')):
                  print('\nFILE',os.path.relpath(p,root),os.path.getsize(p))
                  try:
                      s=open(p,encoding='utf-8').read(5000)
                      print(s[:5000])
                  except Exception as e: print('ERR',e)
          PY
          curl -fL --retry 3 -o /tmp/quran/quran_uthmani.json \
            https://raw.githubusercontent.com/kamalyaser31/minshawi/main/data/assets/quran_uthmani.json
          curl -fL --retry 3 -o /tmp/quran/quran_pages.json \
            https://raw.githubusercontent.com/kamalyaser31/minshawi/main/data/assets/quran_pages.json
          echo '=== QURAN SCHEMA ==='
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/quran/quran_uthmani.json',encoding='utf-8'))
          print(type(q).__name__)
          if isinstance(q,dict):
              print('keys',list(q)[:10]);
              for k in list(q)[:2]: print(k,repr(q[k])[:1500])
          elif isinstance(q,list):
              print('len',len(q)); print(repr(q[:2])[:4000])
          p=json.load(open('/tmp/quran/quran_pages.json',encoding='utf-8'))
          print('pages entries',len(p),'first',list(p.items())[:10],'last',list(p.items())[-5:])
          PY
