name: Verify Al-Minshawi Exact Audio Source

on:
  push:
    branches: [ "quran-minshawi-lost-v1" ]
    paths: [ ".github/workflows/verify-minshawi-source.yml" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check QUA Google Drive chapter sources are directly streamable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qua
          curl -fsSL --retry 3 -o /tmp/qua/minshawi.zip https://github.com/QUD-Technologies/quranic-universal-audio/releases/download/v4.0.0/mohammed_siddiq_al_minshawi_1967_drive.zip
          unzip -q /tmp/qua/minshawi.zip -d /tmp/qua/u
          python3 - <<'PY' > /tmp/urls.txt
          import json,re
          c=json.load(open('/tmp/qua/u/catalog.json',encoding='utf-8'))
          urls=c['audio']['chapter_urls']
          for ch in [1,2,24,55,114]:
              u=urls[str(ch)] if isinstance(urls,dict) else urls[ch-1]
              m=re.search(r'/d/([^/]+)',u)
              if not m: raise SystemExit('No drive id for '+str(ch)+': '+u)
              fid=m.group(1)
              print(ch, 'https://drive.usercontent.google.com/download?id='+fid+'&export=download&confirm=t')
          PY
          while read -r ch url; do
            echo "=== SURAH $ch ==="
            rm -f /tmp/chunk.bin /tmp/hdr.txt
            curl -L --fail --retry 2 --connect-timeout 20 --max-time 45 \
              -H 'Range: bytes=0-65535' -D /tmp/hdr.txt -o /tmp/chunk.bin "$url"
            sed -n '1,30p' /tmp/hdr.txt
            echo bytes=$(wc -c </tmp/chunk.bin)
            file /tmp/chunk.bin
            python3 - <<'PY'
          p='/tmp/chunk.bin'
          b=open(p,'rb').read(16)
          print('first16',b.hex(),b[:3])
          if not (b.startswith(b'ID3') or (len(b)>=2 and b[0]==0xff and (b[1]&0xe0)==0xe0)):
              raise SystemExit('Not MP3 bytes')
          PY
          done < /tmp/urls.txt
