name: Inspect Quranpedia Tabari dump

on:
  push:
    branches: [ "quran-minshawi-lost-v1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Quranpedia dump link and schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://api.quranpedia.net/dumps/tafsir-book-4.json.gz' -o /tmp/tabari.json.gz
          ls -lh /tmp/tabari.json.gz
          python3 - <<'PY'
          import gzip,json
          with gzip.open('/tmp/tabari.json.gz','rt',encoding='utf-8') as f:
              data=json.load(f)
          print('root_keys=',list(data))
          ayahs=data.get('ayahs')
          print('ayahs_type=',type(ayahs).__name__)
          if isinstance(ayahs,dict):
              print('ayahs_count=',len(ayahs))
              keys=list(ayahs)[:5]
              print('ayah_keys=',keys)
              for k in keys[:2]:
                  print('ayah',k,'=',json.dumps(ayahs[k],ensure_ascii=False)[:6000])
          elif isinstance(ayahs,list):
              print('ayahs_count=',len(ayahs))
              for i,x in enumerate(ayahs[:2]): print('ayah',i,'=',json.dumps(x,ensure_ascii=False)[:6000])
          PY
