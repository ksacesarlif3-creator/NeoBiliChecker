name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install PDF table extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate exact offline AAP 2022 tables
        run: python3 tools/generate_aap2022_offline_data.py

      - name: Verify runtime has no network dependency
        shell: bash
        run: |
          test -s app/src/main/java/com/neobili/checker/OfflineThresholdData.kt
          if grep -R "android.permission.INTERNET" -n app/src/main; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi
          if grep -R -E "peditools\.org|okhttp3|org\.jsoup" -n app/src/main app/build.gradle.kts; then
            echo "Unexpected runtime network dependency"
            exit 1
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          KEYSTORE="$RUNNER_TEMP/neobili-release.jks"
          KEY_PASS="$(openssl rand -hex 24)"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found"
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          ALIGNED_APK="$RUNNER_TEMP/NeoBiliChecker-offline-release-aligned.apk"
          FINAL_APK="app/build/outputs/apk/release/NeoBiliChecker-offline-v0.2.1-release.apk"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -alias neobili \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=NeoBili Checker Offline Release, OU=Clinical Reference, O=NeoBili, C=SA"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias neobili \
            --ks-pass "pass:$KEY_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "$RUNNER_TEMP/release-sha256.txt"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoBiliChecker-offline-signed-release
          path: app/build/outputs/apk/release/NeoBiliChecker-offline-v0.2.1-release.apk
          if-no-files-found: error

      - name: Upload release SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: NeoBiliChecker-offline-release-sha256
          path: ${{ runner.temp }}/release-sha256.txt
          if-no-files-found: error
