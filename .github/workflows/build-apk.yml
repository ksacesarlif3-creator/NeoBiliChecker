name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install PDF table extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate exact offline AAP 2022 tables
        run: python3 tools/generate_aap2022_offline_data.py

      - name: Verify runtime has no network dependency
        shell: bash
        run: |
          test -s app/src/main/java/com/neobili/checker/OfflineThresholdData.kt
          if grep -R "android.permission.INTERNET" -n app/src/main; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi
          if grep -R -E "peditools\.org|okhttp3|org\.jsoup" -n app/src/main app/build.gradle.kts; then
            echo "Unexpected runtime network dependency"
            exit 1
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoBiliChecker-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload generated threshold source
        uses: actions/upload-artifact@v4
        with:
          name: NeoBiliChecker-offline-threshold-source
          path: app/src/main/java/com/neobili/checker/OfflineThresholdData.kt
          if-no-files-found: error
