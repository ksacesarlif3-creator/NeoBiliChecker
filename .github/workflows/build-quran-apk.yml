name: Build Al-Minshawi Murattal APK

on:
  workflow_dispatch:
  push:
    branches: [ "quran-minshawi-lost-v1" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare exact Quran words and Minshawi 1967 synchronization data
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="quranapp/src/main/assets"
          TMP="$RUNNER_TEMP/minshawi_sync"
          mkdir -p "$ASSETS" "$TMP"

          curl -fsSL --retry 3 -o "$TMP/qua.zip" \
            https://github.com/QUD-Technologies/quranic-universal-audio/releases/download/v4.0.0/mohammed_siddiq_al_minshawi_1967_drive.zip
          # Keep gzip bytes but give the asset a .bin suffix. AAPT strips .gz from asset names.
          unzip -p "$TMP/qua.zip" word_timestamps.json.gz > "$ASSETS/minshawi_word_timestamps.bin"
          unzip -p "$TMP/qua.zip" catalog.json > "$ASSETS/minshawi_catalog.json"
          unzip -p "$TMP/qua.zip" specials.json > "$ASSETS/minshawi_specials.json"

          curl -fsSL --retry 3 -o "$TMP/digital_khatt_v2_script.json" \
            https://github.com/QUD-Technologies/quranic-universal-audio/releases/download/v4.0.0/digital_khatt_v2_script.json

          curl -fsSL --retry 3 -o "$ASSETS/quran_pages.json" \
            https://raw.githubusercontent.com/kamalyaser31/minshawi/main/data/assets/quran_pages.json

          python3 - <<'PY'
          import gzip,json,os
          A='quranapp/src/main/assets/'
          T=os.environ['RUNNER_TEMP']+'/minshawi_sync/'
          script=json.load(open(T+'digital_khatt_v2_script.json',encoding='utf-8'))
          timing=json.load(gzip.open(A+'minshawi_word_timestamps.bin','rt',encoding='utf-8'))
          pages=json.load(open(A+'quran_pages.json',encoding='utf-8'))
          catalog=json.load(open(A+'minshawi_catalog.json',encoding='utf-8'))

          display={}
          refs=set()
          errors=[]
          total_words=0
          for row in timing['rows']:
              ref,start,end,canonical,silence,words=row
              if not canonical: continue
              s,a=(int(x) for x in ref.split(':'))
              k=f'{s:03d}{a:03d}'
              refs.add(k)
              maxidx=max((int(w[0]) for w in words),default=0)
              tokens=[]
              for wi in range(1,maxidx+1):
                  rec=script.get(f'{s}:{a}:{wi}')
                  if not rec or not isinstance(rec.get('text'),str) or not rec['text'].strip():
                      errors.append((ref,wi,'missing DigitalKhatt word'))
                      break
                  tokens.append(rec['text'].strip())
              if len(tokens)==maxidx:
                  display[k]=' '.join(tokens)
                  total_words += len(tokens)

          print('canonical ayahs',len(refs),'display ayahs',len(display),'timed words',total_words)
          print('page entries',len(pages),'audio chapters',len(catalog['audio']['chapter_urls']))
          print('sample 1:4 =',display.get('001004'))
          if errors:
              print('errors',errors[:20]); raise SystemExit('DigitalKhatt/timing mismatch')
          assert len(refs)==6236 and len(display)==6236
          assert len(pages)==6236
          assert len(catalog['audio']['chapter_urls'])==114
          for k,text in display.items():
              assert k in pages, ('missing page',k)
              assert text.strip(), ('empty text',k)
          json.dump(display,open(A+'quran_display.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

      - name: Force playback/downloads to the exact QUA-matched audio source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='quranapp/src/main/java/com/minshawi/murattal/lost/MainActivityV2.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace('        loadCachedUrls();\n','')
          s=s.replace('        refreshArchiveIndex();\n','')
          s=s.replace(
          '''    private void playSurah(int index, int initialSeekMs) {\n        if (index < 0 || index >= 114) return;''',
          '''    private void playSurah(int index, int initialSeekMs) {\n        if (index < 0 || index >= 114) return;\n        if (syncData == null) {\n            statusText.setText("جاري تجهيز مصدر التلاوة المتزامن…");\n            Toast.makeText(this, "بيانات التزامن تُجهز الآن، أعد المحاولة بعد لحظة", Toast.LENGTH_SHORT).show();\n            return;\n        }''')
          old='''    private String getStreamUrl(int index) {\n        if (streamUrls[index] != null && !streamUrls[index].isEmpty()) return streamUrls[index];\n        return DOWNLOAD_BASE + String.format(Locale.US, "%03d.mp3", index + 1);\n    }'''
          new='''    private String getStreamUrl(int index) {\n        if (syncData == null) return null;\n        return syncData.exactAudioUrl(index + 1);\n    }'''
          if old not in s: raise SystemExit('getStreamUrl source block not found')
          s=s.replace(old,new)
          s=s.replace('new File(getFilesDir(), "audio")','new File(getFilesDir(), "audio_exact_v11")')
          s=s.replace('" • بث مباشر"','" • المصدر المتزامن"')
          s=s.replace('"تشغيل من نسخة الإذاعة 2026 • التزامن كلمة بكلمة مفعّل"','"تشغيل من المصدر الأصلي المطابق لتوقيت الكلمات • التزامن الدقيق مفعّل"')
          s=s.replace('"تم ربط ١١٤ سورة • النص والتزامن جاهزان • يمكنك تنزيل أي سورة للأوفلاين"','"النص والتزامن جاهزان • التشغيل يستخدم المصدر الأصلي المطابق للتوقيت • يمكنك تنزيل أي سورة للأوفلاين"')
          s=s.replace('"مصدر الصوت: نسخة بث 2026 على Archive.org. توقيتات الكلمات: Qur’anic Universal Audio. النص والصفحات: بيانات مصحف المدينة النبوية/حفص."',
                      '"مصدر التشغيل المتزامن: التسجيل الأصلي للختمة الجديدة المطابق لتوقيتات Qur’anic Universal Audio. نسخة بث 2026 محفوظة كمرجع تاريخي لكنها لا تُستخدم للتظليل لأنها تختلف في بعض أعمال القص والمونتاج. النص: رسم عثماني حفص مع تقسيم صفحات مصحف المدينة 604 صفحة."')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        working-directory: quranapp
        run: gradle assembleRelease --stacktrace

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED_APK="$(find quranapp/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          KEYSTORE="$RUNNER_TEMP/minshawi-release.jks"
          PASS="$(openssl rand -hex 24)"
          ALIGNED="$RUNNER_TEMP/minshawi-aligned.apk"
          FINAL="quranapp/build/outputs/apk/release/AlMinshawi-Murattal-Lost-v1.1.0.apk"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias minshawi -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=Al Minshawi Murattal, O=Quran Audio, C=SA"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias minshawi --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL"
          unzip -l "$FINAL" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'assets/minshawi_word_timestamps.bin' "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'assets/quran_display.json' "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'assets/quran_pages.json' "$RUNNER_TEMP/apk-contents.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/minshawi-sha256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMinshawi-Murattal-Lost-v1.1-APK
          path: quranapp/build/outputs/apk/release/AlMinshawi-Murattal-Lost-v1.1.0.apk
          if-no-files-found: error

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: AlMinshawi-Murattal-Lost-v1.1-SHA256
          path: ${{ runner.temp }}/minshawi-sha256.txt
          if-no-files-found: error
